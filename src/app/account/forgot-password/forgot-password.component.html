<app-account-wrapper>
  <!-- Header -->
  <div class="text-center mb-4">
    <div class="mb-3">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:#ecfdf5;border:2px solid #d1fae5;">
        <i class="ri-lock-password-line" style="font-size:1.5rem;color:#059669;"></i>
      </span>
    </div>
    <h5 class="fw-bold text-dark mb-1">{{ 'auth.forgot_password.title' | translate }}</h5>
    <p class="text-muted small mb-0">
      {{ 'auth.forgot_password.subtitle' | translate }}
    </p>
  </div>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-4">
      <label for="email" class="form-label fw-semibold text-secondary small">
        {{ 'auth.forgot_password.email_label' | translate }}
      </label>
      <input
        class="form-control form-control-lg finance-input"
        type="email"
        id="email"
        formControlName="email"
        [placeholder]="'auth.forgot_password.email_placeholder' | translate"
        autocomplete="email"
        [class.is-invalid]="isInvalid('email')"
      />
      @if (isInvalid('email')) {
        <div class="invalid-feedback">{{ 'auth.forgot_password.email_error' | translate }}</div>
      }
    </div>

    <div class="mb-3">
      <button
        class="btn btn-lg w-100 finance-btn"
        type="submit"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          {{ 'auth.forgot_password.sending' | translate }}
        } @else {
          <i class="ri-mail-send-line me-1"></i>{{ 'auth.forgot_password.submit' | translate }}
        }
      </button>
    </div>
  </form>

  <div class="text-center mt-2">
    <p class="text-muted mb-0 small">
      <a routerLink="/login" class="finance-link">
        <i class="ri-arrow-left-line me-1"></i>{{ 'auth.forgot_password.back_to_login' | translate }}
      </a>
    </p>
  </div>
</app-account-wrapper>
