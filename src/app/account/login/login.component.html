<app-account-wrapper>
  <!-- Header -->
  <div class="text-center mb-4">
    <div class="finance-icon-wrapper mb-3">
      <i class="ri-line-chart-fill finance-icon"></i>
    </div>
    <h5 class="fw-bold finance-title mb-1">{{ appTitle }}</h5>
    <p class="text-muted small mb-0">{{ appDescription }}</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- Usuario o Correo -->
    <div class="mb-3">
      <label for="emailaddress" class="form-label fw-semibold text-secondary small">Usuario o correo</label>
      <input
        class="form-control form-control-lg finance-input"
        type="text"
        id="emailaddress"
        formControlName="email"
        placeholder="Ej. usuario&#64;correo.com"
        autocomplete="off"
        [class.is-invalid]="isInvalid('email')"
      />
      @if (isInvalid('email')) {
        <div class="invalid-feedback">Ingresa tu usuario o correo.</div>
      }
    </div>

    <!-- Contraseña -->
    <div class="mb-3">
      <label for="password" class="form-label fw-semibold text-secondary small">Contraseña</label>
      <div class="input-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          class="form-control form-control-lg finance-input"
          formControlName="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="off"
          [class.is-invalid]="isInvalid('password')"
        />
        <button
          class="btn btn-outline-secondary finance-toggle-btn"
          type="button"
          (click)="showPassword = !showPassword"
        >
          <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
        </button>
        @if (isInvalid('password')) {
          <div class="invalid-feedback">Ingresa tu contraseña.</div>
        }
      </div>
    </div>

    <!-- Recordarme + Olvidé contraseña -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="checkbox-signin" />
        <label class="form-check-label text-muted small" for="checkbox-signin">Recordarme</label>
      </div>
      <a routerLink="/forgot-password" class="finance-link small">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- Botón de inicio -->
    <div class="mb-3">
      <button class="btn btn-lg w-100 finance-btn" type="submit" [disabled]="isLoading">
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          Verificando...
        } @else {
          <i class="ri-login-box-line me-1"></i>Iniciar sesión
        }
      </button>
    </div>
  </form>

  <!-- Separador -->
  <div class="text-center mt-3">
    <p class="text-muted mb-0 small">
      ¿No tienes cuenta?
      <a routerLink="/register" class="fw-semibold finance-link">Regístrate</a>
    </p>
  </div>
</app-account-wrapper>
