<app-account-wrapper>
  <!-- Header -->
  <div class="text-center w-75 m-auto mb-4">
    <div class="finance-icon-wrapper mb-2">
      <i class="ri-line-chart-fill finance-icon"></i>
    </div>
    <h4 class="fw-bold finance-title">{{ appTitle }}</h4>
    <p class="text-muted mb-0">{{ appDescription }}</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Usuario o Correo -->
    <div class="mb-3">
      <label for="emailaddress" class="form-label fw-semibold">
        <i class="ri-user-line me-1 text-muted"></i>Usuario o correo
      </label>
      <input
        class="form-control form-control-lg finance-input"
        type="email"
        id="emailaddress"
        formControlName="email"
        placeholder="Ej. usuario&#64;correo.com"
        autocomplete="off"
      />
    </div>

    <!-- Contraseña -->
    <div class="mb-3">
      <label for="password" class="form-label fw-semibold">
        <i class="ri-lock-password-line me-1 text-muted"></i>Contraseña
      </label>
      <div class="input-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          class="form-control form-control-lg finance-input"
          formControlName="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="off"
        />
        <button
          class="btn btn-outline-secondary finance-toggle-btn"
          type="button"
          (click)="showPassword = !showPassword"
        >
          <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
        </button>
      </div>
    </div>

    <!-- Recordarme + Olvidé contraseña -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="checkbox-signin" />
        <label class="form-check-label text-muted small" for="checkbox-signin">Recordarme</label>
      </div>
      <a routerLink="/pages-recoverpw" class="text-muted small">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- Botón de inicio -->
    <div class="mb-3">
      <button class="btn btn-lg w-100 finance-btn" type="submit">
        <i class="ri-login-box-line me-1"></i>Iniciar sesión
      </button>
    </div>
  </form>

  <!-- Separador -->
  <div class="text-center mt-3">
    <p class="text-muted mb-0 small">
      ¿No tienes cuenta?
      <a routerLink="/register" class="fw-semibold finance-link">Regístrate</a>
    </p>
  </div>
</app-account-wrapper>
