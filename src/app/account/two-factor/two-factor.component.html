<app-account-wrapper>
  <!-- Header -->
  <div class="text-center mb-4">
    <div class="mb-3">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:#ecfdf5;border:2px solid #d1fae5;">
        <i class="ri-shield-check-line" style="font-size:1.5rem;color:#059669;"></i>
      </span>
    </div>
    <h5 class="fw-bold text-dark mb-1">{{ 'auth.two_factor.title' | translate }}</h5>
    <p class="text-muted small mb-0">
      {{ 'auth.two_factor.subtitle' | translate }}
    </p>
  </div>

  <form [formGroup]="twoFactorForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-4">
      <label for="code" class="form-label fw-semibold text-secondary small text-center d-block">
        {{ 'auth.two_factor.code_label' | translate }}
      </label>
      <input
        class="form-control form-control-lg finance-input"
        type="text"
        id="code"
        formControlName="code"
        [placeholder]="'auth.two_factor.code_placeholder' | translate"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
        [class.is-invalid]="isInvalid('code')"
      />
      @if (isInvalid('code')) {
        <div class="invalid-feedback text-center">
          {{ 'auth.two_factor.code_error' | translate }}
        </div>
      }
    </div>

    <div class="mb-3">
      <button
        class="btn btn-lg w-100 finance-btn"
        type="submit"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          {{ 'auth.two_factor.verifying' | translate }}
        } @else {
          <i class="ri-shield-check-line me-1"></i>{{ 'auth.two_factor.submit' | translate }}
        }
      </button>
    </div>
  </form>

  <div class="text-center mt-2">
    <p class="text-muted small mb-0">
      {{ 'auth.two_factor.problems' | translate }}
      <a routerLink="/login" class="finance-link">{{ 'auth.two_factor.back_to_login' | translate }}</a>
    </p>
  </div>
</app-account-wrapper>
