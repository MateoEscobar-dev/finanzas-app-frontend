<app-account-wrapper>
  <!-- Header -->
  <div class="text-center mb-4">
    <div class="mb-3">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:#ecfdf5;border:2px solid #d1fae5;">
        <i class="ri-shield-check-line" style="font-size:1.5rem;color:#059669;"></i>
      </span>
    </div>
    <h5 class="fw-bold text-dark mb-1">Verificación en dos pasos</h5>
    <p class="text-muted small mb-0">
      Ingresa el código de 6 dígitos de tu aplicación de autenticación
      (Google Authenticator, Authy, etc.)
    </p>
  </div>

  <form [formGroup]="twoFactorForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-4">
      <label for="code" class="form-label fw-semibold text-secondary small text-center d-block">
        Código de verificación
      </label>
      <input
        class="form-control form-control-lg finance-input"
        type="text"
        id="code"
        formControlName="code"
        placeholder="000000"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
        [class.is-invalid]="isInvalid('code')"
      />
      @if (isInvalid('code')) {
        <div class="invalid-feedback text-center">
          Ingresa el código de 6 dígitos de tu aplicación.
        </div>
      }
    </div>

    <div class="mb-3">
      <button
        class="btn btn-lg w-100 finance-btn"
        type="submit"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          Verificando...
        } @else {
          <i class="ri-shield-check-line me-1"></i>Verificar código
        }
      </button>
    </div>
  </form>

  <div class="text-center mt-2">
    <p class="text-muted small mb-0">
      ¿Problemas con el código?
      <a routerLink="/login" class="finance-link">Volver al inicio de sesión</a>
    </p>
  </div>
</app-account-wrapper>
