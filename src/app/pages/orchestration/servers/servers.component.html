<app-pagetitle
  [title]="'servers' | translate"
  [subtitle]="'orchestration' | translate"
  [pagetitle]="'system' | translate"
></app-pagetitle>

<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <!-- Tabla CRUD -->
        <app-table
          *ngIf="tableConfig"
          [config]="tableConfig"
          (rowAction)="onTableAction($event)"
          (pageChange)="onPageChange($event)"
          (search)="onSearch($event)"
        ></app-table>

        <!-- Indicador de carga -->
        @if (isLoading) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </div>
        }

        <!-- Info de paginación -->
        <div class="mt-3 text-muted small">
          Total de registros: {{ totalRecords }} | Página: {{ currentPage }} |
          Por página: {{ pageSize }}
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Genérica -->
<app-generic-modal
  [isVisible]="isModalVisible"
  [mode]="modalMode"
  [fields]="formFields"
  [data]="selectedItem"
  [isSubmitting]="isModalSubmitting"
  (close)="closeModal()"
  (formSubmit)="submitForm($event)"
></app-generic-modal>

<!-- Modal de Historial -->
<app-history-modal
  [isVisible]="isHistoryModalVisible"
  [logs]="historyLogs"
  [itemLabel]="selectedHistoryItem?.label"
  (close)="closeHistoryModal()"
></app-history-modal>

<!-- Modal de Progreso -->
<app-progress-modal
  [isVisible]="isProgressModalVisible"
  [operationId]="currentOperationId"
  [title]="progressModalTitle"
  (close)="closeProgressModal()"
  (cancel)="cancelCurrentOperation()"
></app-progress-modal>

<!-- Modal de Instalación -->
<app-generic-modal
  [isVisible]="isInstallModalVisible"
  [mode]="'create'"
  [title]="'Instalar en Servidor'"
  [fields]="[
    {
      name: 'domain',
      label: 'Dominio',
      type: 'text',
      required: true,
      placeholder: 'ejemplo.com',
      colSize: 'col-12',
    },
    {
      name: 'email',
      label: 'Email',
      type: 'email',
      required: true,
      placeholder: 'admin@ejemplo.com',
      colSize: 'col-12',
    },
  ]"
  [data]="installData"
  (close)="closeInstallModal()"
  (formSubmit)="submitInstallForm($event)"
></app-generic-modal>

<!-- Modal de Agregar Programa -->
<app-generic-modal
  [isVisible]="isAddProgramModalVisible"
  [mode]="'create'"
  [title]="'Agregar Programa al Servidor'"
  [fields]="[
    {
      name: 'program_id',
      label: 'Programa',
      type: 'select',
      required: true,
      colSize: 'col-12',
      options: availablePrograms,
    },
    {
      name: 'app_name',
      label: 'APP_NAME',
      type: 'text',
      required: false,
      placeholder: 'Banca Virtual',
      colSize: 'col-6',
    },
    {
      name: 'app_env',
      label: 'APP_ENV',
      type: 'text',
      required: false,
      placeholder: 'local',
      colSize: 'col-6',
    },
    {
      name: 'app_key',
      label: 'APP_KEY',
      type: 'textarea',
      required: false,
      placeholder: 'base64:...',
      colSize: 'col-12',
    },
    {
      name: 'app_debug',
      label: 'APP_DEBUG',
      type: 'checkbox',
      required: false,
      colSize: 'col-6',
    },
    {
      name: 'app_url',
      label: 'APP_URL',
      type: 'text',
      required: false,
      placeholder: 'https://ejemplo.com',
      colSize: 'col-6',
    },
    {
      name: 'telegram_bot_token',
      label: 'TELEGRAM_BOT_TOKEN',
      type: 'text',
      required: false,
      placeholder: 'Token del bot',
      colSize: 'col-12',
    },
    {
      name: 'telegram_chat_ids',
      label: 'TELEGRAM_CHAT_IDS',
      type: 'textarea',
      required: false,
      placeholder: '6766003433, 7159857873',
      colSize: 'col-12',
    },
  ]"
  [data]="addProgramData"
  (close)="closeAddProgramModal()"
  (formSubmit)="submitAddProgramForm($event)"
></app-generic-modal>

<!-- Modal de Cambiar Dominio -->
<app-generic-modal
  [isVisible]="isChangeDomainModalVisible"
  [mode]="'edit'"
  [title]="'Cambiar Dominio del Servidor'"
  [fields]="[
    {
      name: 'domain',
      label: 'Nuevo Dominio',
      type: 'text',
      required: true,
      placeholder: 'nuevo-ejemplo.com',
      colSize: 'col-12',
    },
  ]"
  [data]="changeDomainData"
  (close)="closeChangeDomainModal()"
  (formSubmit)="submitChangeDomainForm($event)"
></app-generic-modal>
