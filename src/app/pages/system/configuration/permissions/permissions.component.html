<app-pagetitle
  [title]="'permissions' | translate"
  [subtitle]="'configuration' | translate"
  [pagetitle]="'system' | translate"
></app-pagetitle>

<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <app-table
          *ngIf="tableConfig"
          [config]="tableConfig"
          (rowAction)="onTableAction($event)"
          (pageChange)="onPageChange($event)"
          (search)="onSearch($event)"
        ></app-table>

        @if (isLoading) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">{{ 'labels.loading' | translate }}</span>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
